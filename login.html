<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | Ishaka Hostels</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<nav class="bg-white shadow p-4"><a href="index.html" class="font-bold text-green-700">IshakaHostels</a></nav>
<main class="max-w-sm mx-auto p-6">
  <div id="out" hidden class="bg-white rounded-xl shadow p-6 text-center">
    <p class="text-sm text-gray-500">Signed in as</p>
    <p id="who" class="font-bold break-all"></p>
    <p class="text-sm text-gray-500 mt-1">Account type: <span id="role" class="font-semibold"></span></p>
    <a href="dashboard.html" class="block mt-4 bg-green-700 text-white py-3 rounded-xl font-bold">Go to my dashboard</a>
    <button id="logout" class="mt-3 text-sm text-gray-500 underline">Log out</button>
  </div>

  <div id="in" class="bg-white rounded-xl shadow p-6">
    <div class="flex gap-2 text-sm mb-4">
      <button id="t-login" class="flex-1 py-2 rounded-full border"></button>
      <button id="t-signup" class="flex-1 py-2 rounded-full border"></button>
    </div>
    <form id="form" class="space-y-3">
      <input id="email" type="email" required autocomplete="email" placeholder="Email" class="w-full border p-3 rounded">
      <input id="pw" type="password" required minlength="8" autocomplete="current-password" placeholder="Password (8+ characters)" class="w-full border p-3 rounded">
      <button id="go" class="w-full bg-green-700 text-white p-3 rounded-xl font-bold"></button>
    </form>
    <p id="msg" class="text-sm mt-3" role="status"></p>
    <p class="text-xs text-gray-500 mt-4">Landlords: create an account to post and manage your listings. Students don't need an account.</p>
  </div>
</main>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
let mode = 'login';
const msg = (t, bad) => { $('msg').textContent = t; $('msg').className = 'text-sm mt-3 ' + (bad ? 'text-red-600' : 'text-gray-700'); };
function setMode(m) {
  mode = m;
  $('t-login').textContent = 'Log in'; $('t-signup').textContent = 'Create account';
  $('t-login').className = 'flex-1 py-2 rounded-full border ' + (m === 'login' ? 'bg-green-700 text-white border-green-700' : 'bg-white');
  $('t-signup').className = 'flex-1 py-2 rounded-full border ' + (m === 'signup' ? 'bg-green-700 text-white border-green-700' : 'bg-white');
  $('go').textContent = m === 'login' ? 'Log in' : 'Create account';
  $('pw').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  msg('');
}
async function show() {
  const { data: { session } } = await db.auth.getSession();
  $('in').hidden = !!session; $('out').hidden = !session;
  if (session) {
    $('who').textContent = session.user.email;
    const { data } = await db.from('profiles').select('role').eq('id', session.user.id).single();
    $('role').textContent = data ? data.role : 'landlord';
  }
}
$('t-login').onclick = () => setMode('login');
$('t-signup').onclick = () => setMode('signup');
$('form').onsubmit = async e => {
  e.preventDefault();
  if (SUPABASE_ANON_KEY.includes('PASTE')) return msg('The Supabase key is missing in config.js.', true);
  const email = $('email').value.trim(), password = $('pw').value;
  msg('Please wait...');
  const res = mode === 'login' ? await db.auth.signInWithPassword({ email, password }) : await db.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + '/login.html' } });
  if (res.error) return msg(res.error.message, true);
  if (mode === 'signup' && !res.data.session) return msg('Account created. Check your email for a confirmation link, then log in.');
  msg(''); show();
};
$('logout').onclick = async () => { await db.auth.signOut(); show(); };
setMode('login'); show();
</script>
</body>
</html>
