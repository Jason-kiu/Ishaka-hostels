<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Landlords - Ishaka Hostels</title>
  <link rel="stylesheet" href="styles.css?v=1.0">
</head>
<body>
 <style>
  header {
    background: #333;
    color: #fff;
    padding: 20px 0;
    text-align: center;
    border-bottom: 3px solid #4CAF50;
  }
  nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: center;
  }
  nav ul li {
    margin: 0 15px;
  }
  nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
  }
  #list-property {
    max-width: 500px;
    margin: 40px auto;
    padding: 20px;
    background: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  #listingForm input, #listingForm textarea {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #listingForm button {
    padding: 10px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
</style>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="hostels.html">Hostels</a></li>
        <li><a href="for-landlords.html">List Your Property</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="list-property">
      <h2>List Your Property</h2>
      <form id="listingForm">
        <input type="text" id="hostelName" placeholder="Hostel Name" required>
        <input type="text" id="location" placeholder="Location" required>
        <input type="number" id="price" placeholder="Price (UGX)" required>
        <textarea id="amenities" placeholder="Amenities (e.g. WiFi, water, etc.)"></textarea>
        <input type="text" id="contact" placeholder="Contact (phone/WhatsApp)" required>
        <input type="file" id="images" multiple>
        <button type="submit">Submit Listing</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
