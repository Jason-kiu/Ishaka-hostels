<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><link rel="icon" type="image/svg+xml" href="logo-icon.svg">
<title>Admin | Campus Hostels</title></head>
<body class="bg-gray-50 text-gray-900">
<nav class="bg-white shadow p-4 flex justify-between"><a href="dashboard.html" class="font-bold text-green-700">Admin: approvals</a><a href="index.html" class="text-sm text-gray-500">Site</a></nav>
<main class="max-w-3xl mx-auto p-4">
  <div id="tabs" class="flex gap-2 text-sm my-3"></div>
  <div id="list" class="space-y-3"><p class="text-sm text-gray-500">Loading...</p></div>
</main>
<script src="config.js"></script>
<script src="listings.js"></script>
<script>
const $ = id => document.getElementById(id);
let TAB = 'pending', ROWS = [];
function tabs() {
  $('tabs').innerHTML = [['pending','Pending'],['approved','Live'],['rejected','Rejected'],['rented','Rented out'],['leads','Leads and income']].map(([v, n]) =>
    `<button data-t="${v}" class="px-4 py-1.5 rounded-full border ${v === TAB ? 'bg-green-700 text-white border-green-700' : 'bg-white'}">${n}</button>`).join('');
}
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }
  const { data: p } = await db.from('profiles').select('role').eq('id', session.user.id).single();
  if (!p || p.role !== 'admin') { $('list').innerHTML = '<p class="text-sm">This page is for admins only.</p>'; return; }
  tabs(); load();
})();
async function load() {
  if (TAB === 'leads') return loadLeads();
  const { data, error } = await db.from('listings').select('*').eq('status', TAB).order('created_at', { ascending: false });
  if (error) { $('list').innerHTML = '<p class="text-red-600 text-sm">' + esc(error.message) + '</p>'; return; }
  ROWS = data;
  $('list').innerHTML = data.length ? data.map(l => `<article class="bg-white rounded-xl shadow p-3">
    <div class="flex gap-3">
      <img src="${esc(l.image_url)}" alt="" class="w-28 h-28 object-cover rounded-lg shrink-0">
      <div class="min-w-0 text-sm">
        <h2 class="font-semibold">${esc(l.title)} ${l.featured ? '<span class="text-xs bg-green-100 text-green-800 px-2 rounded">Featured</span>' : ''}</h2>
        <p class="text-gray-500">${esc(l.type)}, ${esc(l.campus)}, ${esc(l.area)}, ${l.walk_mins} min walk. UGX ${l.price/1000}k per ${esc(l.period)}, deposit ${l.deposit/1000}k</p>
        <p class="text-gray-500">${esc(l.room_kind)}. ${l.amenities.map(esc).join(', ')}</p>
        <p class="text-gray-500">${esc(l.landlord_name)}, <a class="text-green-700" href="https://wa.me/${esc(l.phone)}" target="_blank" rel="noopener">${esc(l.phone)}</a></p>
        ${l.note ? '<p class="text-gray-500">' + esc(l.note) + '</p>' : ''}
      </div></div>
    <div class="mt-3 flex flex-wrap gap-2 text-sm">
      ${l.status !== 'approved' ? `<button data-a="approve" data-id="${l.id}" class="bg-green-700 text-white px-4 py-1.5 rounded">Approve</button>` : ''}
      ${l.status !== 'rejected' ? `<button data-a="reject" data-id="${l.id}" class="border px-4 py-1.5 rounded">Reject</button>` : ''}
      ${l.status === 'approved' ? `<button data-a="feature" data-id="${l.id}" class="border px-4 py-1.5 rounded">${l.featured ? 'Remove featured' : 'Make featured'}</button>` : ''}
      <button data-a="campus" data-id="${l.id}" class="border px-4 py-1.5 rounded">Campus: ${esc(l.campus)}</button>
      ${l.status === 'approved' || l.status === 'rented' ? `<button data-a="units" data-id="${l.id}" class="border px-4 py-1.5 rounded">Rooms: ${l.units_available}</button>` : ''}
      <button data-a="delete" data-id="${l.id}" class="text-red-600 px-2">Delete</button>
    </div></article>`).join('') : '<p class="text-sm text-gray-500">Nothing here.</p>';
}
$('tabs').onclick = e => { if (e.target.dataset.t) { TAB = e.target.dataset.t; tabs(); load(); } };
$('list').onclick = async e => {
  const { a, id } = e.target.dataset; if (!a) return;
  if (TAB === 'leads') return leadAction(a, id);
  const l = ROWS.find(x => x.id === id); let q;
  if (a === 'approve') q = db.from('listings').update({ status: 'approved', reject_reason: null, units_available: l.units_available || 1 }).eq('id', id);
  else if (a === 'reject') { const r = prompt('Reason for rejecting (the landlord will see this):'); if (r === null) return; q = db.from('listings').update({ status: 'rejected', reject_reason: r.trim() || null }).eq('id', id); }
  else if (a === 'units') { const v = prompt('Rooms available:', l.units_available); if (v === null) return; const n = Math.max(0, parseInt(v, 10) || 0); const u = { units_available: n }; if (n === 0 && l.status === 'approved') u.status = 'rented'; else if (n > 0 && l.status === 'rented') u.status = 'approved'; q = db.from('listings').update(u).eq('id', id); }
  else if (a === 'campus') { const v = prompt('Campus for this listing:\n' + CAMPUSES.map((c, i) => (i + 1) + '. ' + c).join('\n') + '\nType the number, or a new campus name:', l.campus); if (v === null) return; const t = v.trim(); const c = CAMPUSES[parseInt(t, 10) - 1] || t; if (!c) return; q = db.from('listings').update({ campus: c }).eq('id', id); }
  else if (a === 'feature') q = db.from('listings').update({ featured: !l.featured }).eq('id', id);
  else if (a === 'delete') { if (!confirm('Delete permanently?')) return; q = db.from('listings').delete().eq('id', id); }
  const { error } = await q; if (error) alert(error.message); else load();
};
const wa = p => { p = String(p).replace(/\D/g, ''); return p.startsWith('0') ? '256' + p.slice(1) : p; };
const ug = n => 'UGX ' + (n / 1000) + 'k';
async function loadLeads() {
  const { data, error } = await db.from('leads').select('*').order('created_at', { ascending: false });
  if (error) { $('list').innerHTML = '<p class="text-red-600 text-sm">' + esc(error.message) + '</p>'; return; }
  ROWS = data;
  const sum = f => data.filter(f).reduce((s, x) => s + x.commission_due, 0);
  const stat = (n, v) => `<div class="bg-white rounded-xl shadow p-3"><p class="text-xs text-gray-500">${n}</p><p class="font-bold">${v}</p></div>`;
  $('list').innerHTML = `<div class="grid grid-cols-3 gap-2 text-center text-sm">${stat('Leads', data.length)}${stat('Due, unpaid', ug(sum(x => x.status === 'moved_in' && !x.paid)))}${stat('Collected', ug(sum(x => x.paid)))}</div>` +
    data.map(x => `<article class="bg-white rounded-xl shadow p-3 text-sm">
      <div class="flex justify-between gap-2"><span class="font-mono font-bold">${esc(x.code)}</span>
        <select data-sid="${x.id}" class="border rounded p-1 text-xs bg-white">${['inquiry','viewing','moved_in','cancelled'].map(v => `<option value="${v}" ${v === x.status ? 'selected' : ''}>${v.replace('_', ' ')}</option>`).join('')}</select></div>
      <p class="mt-1">${esc(x.student_name)}${x.course ? ', ' + esc(x.course) : ''}. <a class="text-green-700" href="https://wa.me/${wa(x.student_phone)}" target="_blank" rel="noopener">${esc(x.student_phone)}</a></p>
      <p class="text-gray-500">${esc(x.listing_title)}, ${new Date(x.created_at).toLocaleDateString('en-GB')}${x.notes ? '. Note: ' + esc(x.notes) : ''}</p>
      <div class="mt-2 flex flex-wrap gap-2">
        <button data-a="due" data-id="${x.id}" class="border px-3 py-1 rounded">Due: ${ug(x.commission_due)}</button>
        <button data-a="pay" data-id="${x.id}" class="${x.paid ? 'bg-green-700 text-white' : 'border'} px-3 py-1 rounded">${x.paid ? 'Paid' : 'Mark paid'}</button>
        <button data-a="note" data-id="${x.id}" class="border px-3 py-1 rounded">Note</button>
        <button data-a="ldel" data-id="${x.id}" class="text-red-600 px-2">Delete</button>
      </div></article>`).join('');
}
async function leadAction(a, id) {
  const r = ROWS.find(x => x.id === id); let q;
  if (a === 'pay') q = db.from('leads').update({ paid: !r.paid, paid_at: r.paid ? null : new Date().toISOString() }).eq('id', id);
  else if (a === 'due') { const v = prompt('Commission due (UGX):', r.commission_due); if (v === null) return; q = db.from('leads').update({ commission_due: parseInt(v, 10) || 0 }).eq('id', id); }
  else if (a === 'note') { const v = prompt('Note:', r.notes || ''); if (v === null) return; q = db.from('leads').update({ notes: v.trim() || null }).eq('id', id); }
  else if (a === 'ldel') { if (!confirm('Delete this lead permanently?')) return; q = db.from('leads').delete().eq('id', id); }
  const { error } = await q; if (error) alert(error.message); else load();
}
$('list').onchange = async e => {
  const id = e.target.dataset.sid; if (!id) return;
  const upd = { status: e.target.value }; if (upd.status === 'moved_in') upd.moved_in_at = new Date().toISOString();
  const { error } = await db.from('leads').update(upd).eq('id', id); if (error) alert(error.message); load();
};
</script></body></html>
