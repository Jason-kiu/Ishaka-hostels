<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><title>Admin | Ishaka Hostels</title></head>
<body class="bg-gray-50 text-gray-900">
<nav class="bg-white shadow p-4 flex justify-between"><a href="dashboard.html" class="font-bold text-green-700">Admin: approvals</a><a href="index.html" class="text-sm text-gray-500">Site</a></nav>
<main class="max-w-3xl mx-auto p-4">
  <div id="tabs" class="flex gap-2 text-sm my-3"></div>
  <div id="list" class="space-y-3"><p class="text-sm text-gray-500">Loading...</p></div>
</main>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TAB = 'pending', ROWS = [];
function tabs() {
  $('tabs').innerHTML = [['pending','Pending'],['approved','Live'],['rejected','Rejected']].map(([v, n]) =>
    `<button data-t="${v}" class="px-4 py-1.5 rounded-full border ${v === TAB ? 'bg-green-700 text-white border-green-700' : 'bg-white'}">${n}</button>`).join('');
}
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }
  const { data: p } = await db.from('profiles').select('role').eq('id', session.user.id).single();
  if (!p || p.role !== 'admin') { $('list').innerHTML = '<p class="text-sm">This page is for admins only.</p>'; return; }
  tabs(); load();
})();
async function load() {
  const { data, error } = await db.from('listings').select('*').eq('status', TAB).order('created_at', { ascending: false });
  if (error) { $('list').innerHTML = '<p class="text-red-600 text-sm">' + esc(error.message) + '</p>'; return; }
  ROWS = data;
  $('list').innerHTML = data.length ? data.map(l => `<article class="bg-white rounded-xl shadow p-3">
    <div class="flex gap-3">
      <img src="${esc(l.image_url)}" alt="" class="w-28 h-28 object-cover rounded-lg shrink-0">
      <div class="min-w-0 text-sm">
        <h2 class="font-semibold">${esc(l.title)} ${l.featured ? '<span class="text-xs bg-green-100 text-green-800 px-2 rounded">Featured</span>' : ''}</h2>
        <p class="text-gray-500">${esc(l.type)}, ${esc(l.area)}, ${l.walk_mins} min walk. UGX ${l.price/1000}k per ${esc(l.period)}, deposit ${l.deposit/1000}k</p>
        <p class="text-gray-500">${esc(l.room_kind)}. ${l.amenities.map(esc).join(', ')}</p>
        <p class="text-gray-500">${esc(l.landlord_name)}, <a class="text-green-700" href="https://wa.me/${esc(l.phone)}" target="_blank" rel="noopener">${esc(l.phone)}</a></p>
        ${l.note ? '<p class="text-gray-500">' + esc(l.note) + '</p>' : ''}
      </div></div>
    <div class="mt-3 flex flex-wrap gap-2 text-sm">
      ${l.status !== 'approved' ? `<button data-a="approve" data-id="${l.id}" class="bg-green-700 text-white px-4 py-1.5 rounded">Approve</button>` : ''}
      ${l.status !== 'rejected' ? `<button data-a="reject" data-id="${l.id}" class="border px-4 py-1.5 rounded">Reject</button>` : ''}
      ${l.status === 'approved' ? `<button data-a="feature" data-id="${l.id}" class="border px-4 py-1.5 rounded">${l.featured ? 'Remove featured' : 'Make featured'}</button>` : ''}
      <button data-a="delete" data-id="${l.id}" class="text-red-600 px-2">Delete</button>
    </div></article>`).join('') : '<p class="text-sm text-gray-500">Nothing here.</p>';
}
$('tabs').onclick = e => { if (e.target.dataset.t) { TAB = e.target.dataset.t; tabs(); load(); } };
$('list').onclick = async e => {
  const { a, id } = e.target.dataset; if (!a) return;
  const l = ROWS.find(x => x.id === id); let q;
  if (a === 'approve') q = db.from('listings').update({ status: 'approved', reject_reason: null }).eq('id', id);
  else if (a === 'reject') { const r = prompt('Reason for rejecting (the landlord will see this):'); if (r === null) return; q = db.from('listings').update({ status: 'rejected', reject_reason: r.trim() || null }).eq('id', id); }
  else if (a === 'feature') q = db.from('listings').update({ featured: !l.featured }).eq('id', id);
  else if (a === 'delete') { if (!confirm('Delete permanently?')) return; q = db.from('listings').delete().eq('id', id); }
  const { error } = await q; if (error) alert(error.message); else load();
};
</script></body></html>
