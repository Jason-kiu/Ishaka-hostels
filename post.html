<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><title>Post a listing | Ishaka Hostels</title></head>
<body class="bg-gray-50 text-gray-900">
<nav class="bg-white shadow p-4"><a href="dashboard.html" class="text-green-700 font-semibold">My listings</a></nav>
<main class="max-w-xl mx-auto p-4">
  <h1 id="h" class="text-xl font-bold my-3">Post a listing</h1>
  <p class="text-sm text-gray-500 mb-3">We check every listing before it goes live, usually within a day.</p>
  <form id="f" class="bg-white rounded-xl shadow p-4 space-y-3 text-sm">
    <input id="title" required placeholder="Name e.g. Grace Hostel" class="w-full border p-3 rounded">
    <label class="block"><span class="text-gray-600">Which campus is it near?</span><select id="campus" required class="w-full border p-3 rounded bg-white mt-1"></select></label>
    <div class="grid grid-cols-2 gap-2">
      <select id="type" class="border p-3 rounded bg-white"><option value="hostel">Hostel</option><option value="room">Room</option><option value="apartment">Apartment</option></select>
      <input id="area" required placeholder="Area e.g. Kikoni" class="border p-3 rounded">
    </div>
        <div class="grid grid-cols-2 gap-2">
      <input id="price" type="number" min="1000" required placeholder="Price in UGX e.g. 450000" class="border p-3 rounded">
      <select id="period" class="border p-3 rounded bg-white"><option value="semester">Per semester</option><option value="month">Per month</option></select>
      <input id="deposit" type="number" min="0" placeholder="Deposit in UGX (0 if none)" class="border p-3 rounded">
      <input id="walk" type="number" min="0" required placeholder="Walk to campus (minutes)" class="border p-3 rounded">
    </div>
    <input id="kind" placeholder="Room type e.g. Single, self-contained" class="w-full border p-3 rounded">
    <input id="amen" placeholder="Facilities, separated by commas: Tiled, Water inside, Security" class="w-full border p-3 rounded">
    <textarea id="note" placeholder="Directions or extra details" class="w-full border p-3 rounded"></textarea>
    <div class="grid grid-cols-2 gap-2">
      <input id="lname" required placeholder="Contact name" class="border p-3 rounded">
      <input id="phone" required placeholder="WhatsApp number e.g. 0767037951" class="border p-3 rounded">
    </div>
    <label class="block"><span class="text-gray-600">Main photo</span><input id="photo" type="file" accept="image/*" class="w-full mt-1"></label>
    <img id="prev" class="hidden rounded-lg h-40 object-cover" alt="">
    <button id="go" class="w-full bg-green-700 text-white p-3 rounded-xl font-bold">Submit for approval</button>
    <p id="msg" class="text-sm" role="status"></p>
  </form>
</main>
<script src="config.js"></script>
<script src="listings.js"></script>
<script>
const $ = id => document.getElementById(id);
document.getElementById('campus').innerHTML = CAMPUSES.map(c => `<option>${esc(c)}</option>`).join('');
const editId = new URLSearchParams(location.search).get('id');
let UID, imageUrl = null;
const msg = (t, bad) => { $('msg').textContent = t; $('msg').className = 'text-sm ' + (bad ? 'text-red-600' : 'text-gray-700'); };
const phone = v => { v = v.replace(/\D/g, ''); return v.startsWith('0') ? '256' + v.slice(1) : v; };
async function shrink(file) {
  const img = await createImageBitmap(file), s = Math.min(1, 1200 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }
  UID = session.user.id;
  if (!editId) return;
  $('h').textContent = 'Edit listing';
  const { data: l } = await db.from('listings').select('*').eq('id', editId).eq('owner_id', UID).single();
  if (!l) { msg('Listing not found.', true); return; }
  imageUrl = l.image_url;
  Object.entries({ title:l.title, type:l.type, campus:l.campus, area:l.area, price:l.price, period:l.period, deposit:l.deposit, walk:l.walk_mins, kind:l.room_kind, amen:l.amenities.join(', '), note:l.note, lname:l.landlord_name, phone:l.phone }).forEach(([k, v]) => $(k).value = v);
  $('prev').src = imageUrl; $('prev').classList.remove('hidden');
  msg('Saving changes sends this listing for approval again.');
})();
$('photo').onchange = e => { const f = e.target.files[0]; if (f) { $('prev').src = URL.createObjectURL(f); $('prev').classList.remove('hidden'); } };
$('f').onsubmit = async e => {
  e.preventDefault(); $('go').disabled = true; msg('Saving...');
  try {
    const f = $('photo').files[0];
    if (f) {
      const path = UID + '/' + Date.now() + '.jpg';
      const { error } = await db.storage.from('listing-images').upload(path, await shrink(f), { contentType: 'image/jpeg' });
      if (error) throw error;
      imageUrl = db.storage.from('listing-images').getPublicUrl(path).data.publicUrl;
    }
    if (!imageUrl) throw new Error('Please add a photo.');
    const row = { title:$('title').value.trim(), type:$('type').value, campus:$('campus').value, area:$('area').value.trim(), price:+$('price').value, period:$('period').value,
      deposit:+$('deposit').value || 0, walk_mins:+$('walk').value, room_kind:$('kind').value.trim(), note:$('note').value.trim(),
      amenities:$('amen').value.split(',').map(s => s.trim()).filter(Boolean), image_url:imageUrl, phone:phone($('phone').value), landlord_name:$('lname').value.trim() };
    const { error } = editId ? await db.from('listings').update(row).eq('id', editId) : await db.from('listings').insert(row);
    if (error) throw error;
    location.href = 'dashboard.html';
  } catch (err) { msg(err.message, true); $('go').disabled = false; }
};
</script></body></html>
