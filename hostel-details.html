<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing details | Ishaka Hostels</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">
<nav class="p-4 shadow"><a href="hostels.html" class="text-green-700 font-semibold">All listings</a></nav>
<main id="app" class="max-w-4xl mx-auto p-4 pb-28 md:pb-4"></main>
<script src="listings.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const l = LISTINGS.find(x => x.id === id && x.status === 'approved');
const app = document.getElementById('app');
if (!l) {
  document.title = 'Listing not found | Ishaka Hostels';
  app.innerHTML = '<div class="text-center py-16"><p class="font-semibold">This listing is not available.</p><p class="text-sm text-gray-500 mt-1">It may have been rented out or removed.</p><a href="hostels.html" class="inline-block mt-3 text-green-700 font-semibold">Browse all listings</a></div>';
} else {
  document.title = `${l.title}, ${l.area} | Ishaka Hostels`;
  const fact = (k, v) => `<div><p class="text-xs text-gray-500">${k}</p><p class="font-bold">${esc(v)}</p></div>`;
  app.innerHTML = `
    <img src="${esc(l.image)}" alt="${esc(l.title)}" class="rounded-xl w-full h-72 md:h-96 object-cover">
    <h1 class="text-2xl font-bold mt-4">${esc(l.title)}, ${esc(l.area)} ${l.sample ? '<span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded align-middle">Sample</span>' : ''}</h1>
    <p class="text-gray-500">${l.walkMins} min walk to KIU${l.note ? '. ' + esc(l.note) : ''}</p>
    <div class="mt-4 grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
      ${fact('Price', money(l).replace('UGX ', ''))}
      ${fact('Deposit', l.deposit ? `${l.deposit/1000}k` : 'None')}
      ${fact('Room', l.roomKind)}
      ${fact('Posted by', l.landlord)}
    </div>


<div class="max-w-4xl mx-auto p-4">
        <img src="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=800" class="rounded-xl w-full h-80 object-cover">
        <h1 class="text-2xl font-bold mt-4">Campus View Hostel - KIU Road</h1>
        <p class="text-gray-500">📍 3 mins walk to KIU Main Gate, Opposite Total</p>

        <div class="mt-4 grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
            <div><p class="text-xs text-gray-500">Price</p><p class="font-bold">450k per Sem</p></div>
            <div><p class="text-xs text-gray-500">Deposit</p><p class="font-bold">50k (refundable)</p></div>
            <div><p class="text-xs text-gray-500">Type</p><p class="font-bold">Single, Self-contained</p></div>
            <div><p class="text-xs text-gray-500">Water</p><p class="font-bold">Inside + Tank</p></div>
        </div>

        <h3 class="font-bold mt-6">Facilities</h3>
        <p class="text-sm mt-2">✅ Tiled ✅ Ceiling ✅ Security Guard ✅ Parking ✅ Near Water Source</p>

        <div class="mt-6 p-4 bg-green-50 rounded-xl">
            <h3 class="font-bold">Student Reviews (3)</h3>
            <p class="text-sm mt-2">⭐⭐⭐⭐⭐ "Very clean and landlord is good" - Brenda, Medicine 2025</p>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-2xl flex gap-2 md:relative md:shadow-none md:mt-6">
            <a href="tel:+256767037951" class="flex-1 border-2 border-green-700 text-green-700 py-3 rounded-xl text-center font-bold">📞 Call</a>
            <a href="https://wa.me/256767037951?text=Hi%20Jason,%20I%20want%20Grace%20Hostel%20KIU%20Road%20-%20https://ishaka-hostels.vercel.app" class="flex-[2] bg-green-700 text-white py-3 rounded-xl text-center font-bold">💬 Book on WhatsApp</a>
        </div>
    </div>

    
</body>
</html>
