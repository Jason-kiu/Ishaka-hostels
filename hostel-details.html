<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing details | Ishaka Hostels</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">
<nav class="p-4 shadow"><a href="hostels.html" class="text-green-700 font-semibold">All listings</a></nav>
<main id="app" class="max-w-4xl mx-auto p-4 pb-28 md:pb-4"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="listings.js"></script>
<script>
(async () => {
const id = new URLSearchParams(location.search).get('id');
const l = await loadListing(id);
const app = document.getElementById('app');
if (!l) {
  document.title = 'Listing not found | Ishaka Hostels';
  app.innerHTML = '<div class="text-center py-16"><p class="font-semibold">This listing is not available.</p><p class="text-sm text-gray-500 mt-1">It may have been rented out or removed.</p><a href="hostels.html" class="inline-block mt-3 text-green-700 font-semibold">Browse all listings</a></div>';
} else {
  document.title = `${l.title}, ${l.area} | Ishaka Hostels`;
  const fact = (k, v) => `<div><p class="text-xs text-gray-500">${k}</p><p class="font-bold">${esc(v)}</p></div>`;
  app.innerHTML = `
    <img src="${esc(l.image)}" alt="${esc(l.title)}" class="rounded-xl w-full h-72 md:h-96 object-cover">
    <h1 class="text-2xl font-bold mt-4">${esc(l.title)}, ${esc(l.area)} ${l.sample ? '<span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded align-middle">Sample</span>' : ''}</h1>
    <p class="text-gray-500">${l.walkMins} min walk to KIU${l.note ? '. ' + esc(l.note) : ''}</p>
    <div class="mt-4 grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
      ${fact('Price', money(l).replace('UGX ', ''))}
      ${fact('Deposit', l.deposit ? `${l.deposit/1000}k` : 'None')}
      ${fact('Room', l.roomKind)}
      ${fact('Posted by', l.landlord)}
    </div>
    <h2 class="font-bold mt-6">Facilities</h2>
    <p class="mt-2 flex flex-wrap gap-2">${l.amenities.map(a => `<span class="text-sm bg-green-50 text-green-800 px-3 py-1 rounded-full">${esc(a)}</span>`).join('')}</p>
    ${l.reviews.length ? `<div class="mt-6 p-4 bg-green-50 rounded-xl"><h2 class="font-bold">Student reviews (${l.reviews.length})</h2>${l.reviews.map(r => `<p class="text-sm mt-2">${'★'.repeat(r.stars)} "${esc(r.text)}" - ${esc(r.name)}</p>`).join('')}</div>` : ''}
    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-2xl flex gap-2 md:static md:shadow-none md:mt-6 md:p-0">
      <button data-lead="${esc(l.id)}" data-act="call" class="flex-1 border-2 border-green-700 text-green-700 py-3 rounded-xl text-center font-bold">Call</button>
      <button data-lead="${esc(l.id)}" class="flex-[2] bg-green-700 text-white py-3 rounded-xl text-center font-bold">Message on WhatsApp</button>
    </div>`;
}
})();
</script>
</body>
</html>
