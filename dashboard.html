<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><link rel="icon" type="image/svg+xml" href="logo-icon.svg">
<title>My listings | Campus Hostels</title></head>
<body class="bg-gray-50 text-gray-900">
<nav class="bg-white shadow p-4 flex justify-between items-center">
  <a href="index.html" class="shrink-0" aria-label="Campus Hostels home"><img src="logo.svg" alt="Campus Hostels" class="h-8 sm:h-10 w-auto"></a>
  <span class="text-sm"><a id="adm" hidden href="admin.html" class="text-green-700 font-semibold mr-4">Admin</a><a href="login.html" class="text-gray-500">Account</a></span>
</nav>
<main class="max-w-3xl mx-auto p-4">
  <div class="flex justify-between items-center my-4">
    <h1 class="text-xl font-bold">My listings</h1>
    <a href="post.html" class="bg-green-700 text-white px-4 py-2 rounded-full text-sm">Post a listing</a>
  </div>
  <p class="text-sm text-gray-500 mb-4">New listings and edits are checked before they go live.</p>
  <div id="list" class="space-y-3"><p class="text-sm text-gray-500">Loading...</p></div>
  <section class="mt-8">
    <h2 class="text-xl font-bold">Student leads</h2>
    <p class="text-sm text-gray-500 mt-1 mb-3">Students who contacted you through the site. When a student moves in, enter their reference code. A commission is due to Campus Hostels for each move-in.</p>
    <form id="mi" class="flex gap-2"><input id="code" required placeholder="Reference code e.g. 7F3A9C" class="flex-1 border p-3 rounded uppercase"><button class="bg-green-700 text-white px-4 rounded">Mark moved in</button></form>
    <p id="mimsg" class="text-sm mt-2" role="status"></p>
    <div id="leads" class="space-y-2 mt-3"></div>
  </section>
</main>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BADGE = { pending:['Waiting for approval','bg-yellow-100 text-yellow-800'], approved:['Live','bg-green-100 text-green-800'], rented:['Rented out','bg-gray-200 text-gray-700'], rejected:['Rejected','bg-red-100 text-red-800'] };
let UID;
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }
  UID = session.user.id;
  const { data: p } = await db.from('profiles').select('role').eq('id', UID).single();
  if (p && p.role === 'admin') $('adm').hidden = false;
  load(); loadLeads();
})();
async function load() {
  const { data, error } = await db.from('listings').select('*').eq('owner_id', UID).order('created_at', { ascending: false });
  if (error) { $('list').innerHTML = '<p class="text-red-600 text-sm">' + esc(error.message) + '</p>'; return; }
  $('list').innerHTML = data.length ? data.map(l => {
    const [t, c] = BADGE[l.status];
    return `<article class="bg-white rounded-xl shadow p-3 flex gap-3">
      <img src="${esc(l.image_url)}" alt="" class="w-24 h-24 object-cover rounded-lg shrink-0">
      <div class="flex-1 min-w-0">
        <h2 class="font-semibold truncate">${esc(l.title)}</h2>
        <p class="text-sm text-gray-500">UGX ${l.price/1000}k per ${esc(l.period)}, ${esc(l.area)}</p>
        <span class="inline-block text-xs px-2 py-0.5 rounded mt-1 ${c}">${t}</span>
        ${l.status === 'rented' ? '<p class="text-xs text-gray-500 mt-1">All rooms taken. Edit to add available rooms and relist.</p>' : ''}
        ${l.status === 'rejected' && l.reject_reason ? '<p class="text-xs text-red-600 mt-1">Reason: ' + esc(l.reject_reason) + '</p>' : ''}
        <div class="mt-2 text-sm flex gap-4">
          ${l.status === 'approved' ? '<a class="text-green-700" href="hostel-details.html?id=' + l.id + '">View</a>' : ''}
          <a class="text-green-700" href="post.html?id=${l.id}">Edit</a>
          <button data-del="${l.id}" class="text-red-600">Delete</button>
        </div>
      </div></article>`;
  }).join('') : '<div class="bg-white rounded-xl p-8 text-center"><p class="font-semibold">No listings yet.</p><a href="post.html" class="inline-block mt-3 text-green-700 font-semibold">Post your first listing</a></div>';
}
$('list').onclick = async e => {
  const id = e.target.dataset.del;
  if (!id || !confirm('Delete this listing?')) return;
  const { error } = await db.from('listings').delete().eq('id', id);
  if (error) alert(error.message); else load();
};
const wa = p => { p = String(p).replace(/\D/g, ''); return p.startsWith('0') ? '256' + p.slice(1) : p; };
const LB = { inquiry:['Inquiry','bg-gray-100 text-gray-700'], viewing:['Viewing','bg-blue-100 text-blue-800'], moved_in:['Moved in','bg-green-100 text-green-800'], cancelled:['Cancelled','bg-red-100 text-red-800'] };
async function loadLeads() {
  const { data, error } = await db.from('leads').select('*').order('created_at', { ascending: false });
  if (error) { $('leads').innerHTML = '<p class="text-red-600 text-sm">' + esc(error.message) + '</p>'; return; }
  $('leads').innerHTML = data.length ? data.map(x => {
    const [t, c] = LB[x.status];
    return `<div class="bg-white rounded-xl shadow p-3 text-sm">
      <div class="flex justify-between gap-2"><span class="font-mono font-bold">${esc(x.code)}</span><span class="text-xs px-2 py-0.5 rounded ${c}">${t}</span></div>
      <p class="mt-1">${esc(x.student_name)}${x.course ? ', ' + esc(x.course) : ''}. <a class="text-green-700" href="https://wa.me/${wa(x.student_phone)}" target="_blank" rel="noopener">${esc(x.student_phone)}</a></p>
      <p class="text-gray-500">${esc(x.listing_title)}, ${new Date(x.created_at).toLocaleDateString('en-GB')}</p>
      ${x.status === 'moved_in' ? `<p class="mt-1 text-gray-700">Commission: UGX ${x.commission_due / 1000}k, ${x.paid ? 'paid' : 'not yet paid'}</p>` : ''}
    </div>`;
  }).join('') : '<p class="text-sm text-gray-500">No student leads yet.</p>';
}
$('mi').onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.rpc('mark_moved_in', { p_code: $('code').value });
  $('mimsg').textContent = error ? error.message : 'Marked as moved in.';
  $('mimsg').className = 'text-sm mt-2 ' + (error ? 'text-red-600' : 'text-green-700');
  if (!error) { $('code').value = ''; loadLeads(); }
};
</script></body></html>
